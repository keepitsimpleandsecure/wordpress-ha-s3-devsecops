# WordPress (chart bitnami/wordpress, version dans scripts/versions.env)
# Aucun mot de passe ici : admin dans le Secret wordpress-credentials,
# base dans le Secret db-credentials (cle mariadb-password).
global:
  security:
    allowInsecureImages: true

image:
  # Image Bitnami a jour (photon 5.0, 0 CVE HIGH/CRITICAL au 2026-10-08) au lieu de l'archive
  # bitnamilegacy (78 CRITICAL, 430 HIGH). Epinglee par empreinte : le contenu ne peut pas changer.
  registry: docker.io
  repository: bitnami/wordpress
  tag: latest
  digest: sha256:845d250ecd73f5e9b8ab2c42ab8b32407992456bab4dcb79547f2c0b7d25959b
  pullPolicy: Always

# Constat accepte (jusqu'au 2026-11-08) : voir RAPPORT.md, constats acceptes.
commonAnnotations:
  checkov.io/skip1: CKV_K8S_40=image Bitnami prevue pour l UID 1001, volumes hostPath de Minikube sans fsGroup, revue 2026-11-08

wordpressUsername: root

# Conteneur durci : jamais root, pas d'escalade de privileges (les autres reglages du chart restent actifs)
containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
existingSecret: wordpress-credentials

externalDatabase:
  # Un seul noeud ecrivain (voir extraFlags dans db_values.yaml)
  host: db-mariadb-galera-0.db-mariadb-galera-headless.wordpress.svc.cluster.local
  port: 3306
  user: user
  database: wordpress
  existingSecret: db-credentials

mariadb:
  enabled: false

service:
  type: NodePort

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 512Mi
    cpu: 300m
  limits:
    memory: 1Gi
    cpu: 600m

# En-tetes de securite HTTP (ticket ZAP) : directives chargees au demarrage d'Apache depuis la
# ConfigMap k8s/wordpress-entetes.yaml (le chart exige allowOverrideNone: false pour customHTAccessCM).
allowOverrideNone: false
customHTAccessCM: wordpress-htaccess
