# WordPress (chart bitnami/wordpress, version dans scripts/versions.env)
# Aucun mot de passe ici : admin dans le Secret wordpress-credentials,
# base dans le Secret db-credentials (cle mariadb-password).
global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/wordpress
  tag: 6.8.2-debian-12-r5

wordpressUsername: root
existingSecret: wordpress-credentials

externalDatabase:
  # Un seul noeud ecrivain (voir extraFlags dans db_values.yaml)
  host: db-mariadb-galera-0.db-mariadb-galera-headless.default.svc.cluster.local
  port: 3306
  user: user
  database: wordpress
  existingSecret: db-credentials

mariadb:
  enabled: false

service:
  type: NodePort

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 512Mi
    cpu: 300m
  limits:
    memory: 1Gi
    cpu: 600m
