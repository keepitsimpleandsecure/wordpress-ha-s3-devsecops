apiVersion: v1
kind: ServiceAccount
metadata:
  name: liqo-auth
  namespace: liqo
# Jeton non monte automatiquement : il n'est fourni qu'aux pods qui en ont besoin
automountServiceAccountToken: false
---
# Moindre privilege : l'ancien binding donnait cluster-admin (tous les droits sur le cluster)
# au compte liqo-auth. Il n'a besoin que de lire les namespaces et les noeuds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: liqo-auth-lecture
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liqo-auth-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: liqo-auth-lecture
subjects:
  - kind: ServiceAccount
    name: liqo-auth
    namespace: liqo
