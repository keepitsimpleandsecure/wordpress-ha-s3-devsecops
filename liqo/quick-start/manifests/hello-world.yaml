# Demo Liqo (hors perimetre de deploiement du projet) : pods durcis.
# Image nginx-hello : ecoute sur 8080 et tourne sans root.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-local
  namespace: liqo-demo
  labels:
    app: liqo-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10101
    runAsGroup: 10101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginxdemos/nginx-hello:plain-text
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
          name: web
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      livenessProbe:
        httpGet:
          path: /
          port: web
      readinessProbe:
        httpGet:
          path: /
          port: web
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: liqo.io/type
                operator: NotIn
                values:
                  - virtual-node
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-remote
  namespace: liqo-demo
  labels:
    app: liqo-demo
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10101
    runAsGroup: 10101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginxdemos/nginx-hello:plain-text
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
          name: web
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      livenessProbe:
        httpGet:
          path: /
          port: web
      readinessProbe:
        httpGet:
          path: /
          port: web
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: liqo.io/type
                operator: In
                values:
                  - virtual-node
---
apiVersion: v1
kind: Service
metadata:
  name: liqo-demo
  namespace: liqo-demo
spec:
  ports:
    - name: web
      port: 80
      protocol: TCP
      targetPort: web
  selector:
    app: liqo-demo
  type: ClusterIP
