# Controles de securite a chaque push et sur chaque PR vers main.
# Toutes les versions sont epinglees ; aucun controle n'est tolere en echec.
name: securite

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Installer gitleaks 8.30.1 (somme verifiee)
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Secrets dans tout l'historique
        run: ./gitleaks git . --redact --no-banner -v

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Generer les manifestes
        run: ./scripts/rendre-manifestes.sh
      - name: Trivy config (HIGH et CRITICAL bloquants)
        run: |
          for cible in rendu liqo images; do
            echo "== $cible"
            docker run --rm -v "$PWD:/r" -w /r aquasec/trivy:0.75.0 config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore "$cible"
          done

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Generer les manifestes
        run: ./scripts/rendre-manifestes.sh
      - name: Checkov Terraform
        run: docker run --rm -v "$PWD:/r" -w /r bridgecrew/checkov:3.3.26 -d infra --config-file .checkov.yaml
      - name: Checkov Kubernetes
        run: docker run --rm -v "$PWD:/r" -w /r bridgecrew/checkov:3.3.26 -d rendu --framework kubernetes --config-file .checkov.yaml

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire l'image Galera corrigee
        run: docker build -t localhost/mariadb-galera-corrige:ci images/mariadb-galera
      - name: Images (CRITICAL avec correctif disponible bloquants)
        run: |
          for img in docker.io/bitnami/wordpress@sha256:845d250ecd73f5e9b8ab2c42ab8b32407992456bab4dcb79547f2c0b7d25959b localhost/mariadb-galera-corrige:ci; do
            echo "== $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/r" -w /r aquasec/trivy:0.75.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed --ignorefile .trivyignore "$img"
          done
