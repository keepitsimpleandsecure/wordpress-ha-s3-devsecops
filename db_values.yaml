# Base MariaDB Galera (chart bitnami/mariadb-galera, version dans scripts/versions.env)
# Aucun mot de passe ici : ils sont lus dans le Secret db-credentials (scripts/creer-secrets.sh).
global:
  security:
    # Les images bitnami/* versionnees ont ete retirees de Docker Hub en 2025.
    # On utilise l'archive bitnamilegacy, que le chart refuse sans cette option.
    allowInsecureImages: true

replicaCount: 2

image:
  # Image construite a partir de images/mariadb-galera/Dockerfile (base bitnamilegacy epinglee par
  # empreinte + mises a jour de securite Debian) : 18 CRITICAL corrigibles -> 2 (Go, non corrigibles par apt).
  # Construction sur le labo : minikube image build -t local/mariadb-galera-corrige:12.0.2-r0-correctifs1 images/mariadb-galera
  registry: docker.io
  repository: local/mariadb-galera-corrige
  tag: 12.0.2-r0-correctifs1
  pullPolicy: IfNotPresent

# Image locale sans registre : empreinte et pull Always impossibles ici (accepte jusqu'au 2026-11-08).
commonAnnotations:
  checkov.io/skip1: CKV_K8S_43=image construite localement dans Minikube, base epinglee par empreinte dans le Dockerfile, revue 2026-11-08
  checkov.io/skip2: CKV_K8S_15=image locale sans registre, un pull Always echouerait, revue 2026-11-08

existingSecret: db-credentials

rootUser:
  user: root1

db:
  name: wordpress
  user: user

galera:
  name: db
  bootstrap:
    forceSafeToBootstrap: true

# Avec 2 noeuds, Galera regle auto_increment_increment a 2 : l'admin WordPress recevrait
# l'ID 2 et l'installation Bitnami (qui attend l'ID 1) echouerait.
# WordPress n'ecrit que sur le noeud 0 (voir wp_values.yaml) : on desactive ce reglage.
extraFlags: "--wsrep_auto_increment_control=OFF --auto_increment_increment=1 --auto_increment_offset=1"

persistence:
  enabled: true
  size: 2Gi
