replicaCount: 2
image:
  registry: docker.io
  repository: bitnami/mariadb-galera
  tag: 10.5
  pullPolicy: IfNotPresent

rootUser:
  user: root1
  password: <DB_ROOT_PASSWORD>

diagnosticMode:
  enabled: false	
service:
  type: ClusterIP
  port: 3306


persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
db:
  name: wordpress
  user: user
  password: <DB_PASSWORD>
galera:
  name: db
  bootstrap:
    forceSafeToBootstrap: true
customDatabase:
  name: wordpress
extraUsers:
  - name: user
    password: <DB_PASSWORD>
    privileges: "wordpress.*:ALL"

